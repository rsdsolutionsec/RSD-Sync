services:
  redis:
    image: redis:7.4-alpine
    container_name: rsd-sync-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - rsd_sync_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - rsd_sync_network
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg17
    container_name: rsd-sync-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rsd_sync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rsd_sync_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-rsd_sync_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54332}:5432"
    volumes:
      - rsd_sync_pg_data:/var/lib/postgresql/data
      - ./packages/database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rsd_sync} -d ${POSTGRES_DB:-rsd_sync_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - rsd_sync_network
    restart: unless-stopped

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: rsd-sync-api
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      API_HOST: 0.0.0.0
      API_PORT: ${API_PORT:-4000}
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER:-rsd_sync}:${POSTGRES_PASSWORD:-rsd_sync_dev_password}@postgres:5432/${POSTGRES_DB:-rsd_sync_dev}
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - rsd_sync_network
    restart: unless-stopped

  worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    container_name: rsd-sync-worker
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER:-rsd_sync}:${POSTGRES_PASSWORD:-rsd_sync_dev_password}@postgres:5432/${POSTGRES_DB:-rsd_sync_dev}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - rsd_sync_network
    restart: unless-stopped

  admin:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.admin
    container_name: rsd-sync-admin
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${ADMIN_PORT:-3000}
    ports:
      - "127.0.0.1:${ADMIN_PORT:-3000}:3000"
    depends_on:
      - api
    networks:
      - rsd_sync_network
    restart: unless-stopped

volumes:
  rsd_sync_redis_data:
  rsd_sync_pg_data:

networks:
  rsd_sync_network:
    driver: bridge
